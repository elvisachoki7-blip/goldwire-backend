<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLDWIRE — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff; --ink:#14110f; --ink-soft:#4a4540;
    --gold:#e8a317; --gold-deep:#a5730f; --gold-pale:#fff3d9;
    --green:#0f9d58; --green-pale:#e5f6ec;
    --red:#e63946; --red-pale:#fdebec;
    --line:#e9e5df;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter', sans-serif; background:var(--white); color:var(--ink);}
  .wrap{max-width:560px; margin:0 auto; padding:60px 24px;}
  .logo{font-family:'Bricolage Grotesque', sans-serif; font-weight:800; font-size:20px; margin-bottom:6px;}
  .logo span{color:var(--gold);}
  .tag{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); margin-bottom:30px; display:block;}
  .card{border:2px solid var(--line); border-radius:18px; padding:28px; margin-bottom:20px;}
  h2{font-family:'Bricolage Grotesque', sans-serif; font-size:19px; margin-bottom:16px;}
  label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; margin-top:12px;}
  label:first-of-type{margin-top:0;}
  input, select, textarea{width:100%; padding:11px 13px; border-radius:9px; border:2px solid var(--line); font-size:14px; font-family:inherit;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--gold);}
  button{width:100%; margin-top:18px; padding:13px; border-radius:100px; border:none; background:var(--ink); color:#fff; font-weight:700; font-size:14px; cursor:pointer;}
  button:hover{background:var(--gold-deep);}
  .error{color:var(--red); font-size:13px; margin-top:10px; display:none;}
  .success{color:var(--green); font-size:13px; margin-top:10px; display:none;}
  .signal-row{border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-top:10px; font-size:13px; font-family:'IBM Plex Mono', monospace;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">GOLD<span>WIRE</span></div>
  <span class="tag">ADMIN PANEL</span>

  <div id="loginView" class="card">
    <h2>Admin login</h2>
    <label>Password</label>
    <input type="password" id="adminPassword" placeholder="Admin password">
    <button id="loginBtn">Log in</button>
    <div class="error" id="loginError"></div>
  </div>

  <div id="panelView" style="display:none;">
    <div class="card">
      <h2>Post a new signal</h2>
      <label>Instrument</label>
      <select id="instrument">
        <option value="XAU/USD">XAU/USD</option>
        <option value="USTEC">USTEC</option>
      </select>
      <label>Direction</label>
      <select id="direction">
        <option value="buy">Buy</option>
        <option value="sell">Sell</option>
      </select>
      <label>Entry</label>
      <input type="text" id="entry" placeholder="2384.20">
      <label>Stop loss</label>
      <input type="text" id="stopLoss" placeholder="2378.00">
      <label>Take profit</label>
      <input type="text" id="takeProfit" placeholder="2396.50">
      <label>Note (optional)</label>
      <textarea id="note" rows="2" placeholder="EMA + RSI + MACD aligned, ATR exit set."></textarea>
      <button id="postBtn">Send to subscribers</button>
      <div class="error" id="postError"></div>
      <div class="success" id="postSuccess"></div>
    </div>

    <div class="card">
      <h2>Recent signals</h2>
      <div id="recentList"></div>
    </div>
  </div>
</div>

<script>
  const API_BASE = window.GOLDWIRE_API_BASE || 'http://localhost:4000';
  let adminToken = sessionStorage.getItem('goldwire_admin_token');

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const password = document.getElementById('adminPassword').value;
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    try {
      const resp = await fetch(API_BASE + '/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Login failed');
      adminToken = data.token;
      sessionStorage.setItem('goldwire_admin_token', adminToken);
      showPanel();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    }
  });

  document.getElementById('postBtn').addEventListener('click', async () => {
    const payload = {
      instrument: document.getElementById('instrument').value,
      direction: document.getElementById('direction').value,
      entry: document.getElementById('entry').value,
      stop_loss: document.getElementById('stopLoss').value,
      take_profit: document.getElementById('takeProfit').value,
      note: document.getElementById('note').value,
    };
    const errEl = document.getElementById('postError');
    const okEl = document.getElementById('postSuccess');
    errEl.style.display = 'none'; okEl.style.display = 'none';

    if (!payload.entry || !payload.stop_loss || !payload.take_profit) {
      errEl.textContent = 'Entry, stop loss and take profit are required.';
      errEl.style.display = 'block';
      return;
    }

    try {
      const resp = await fetch(API_BASE + '/api/signals/admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + adminToken },
        body: JSON.stringify(payload),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Could not post signal');
      okEl.textContent = 'Signal sent to subscribers.';
      okEl.style.display = 'block';
      loadRecent();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    }
  });

  async function loadRecent() {
    try {
      const resp = await fetch(API_BASE + '/api/signals/recent', {
        headers: { Authorization: 'Bearer ' + adminToken },
      });
      const data = await resp.json();
      document.getElementById('recentList').innerHTML = (data.signals || []).map(s => `
        <div class="signal-row">${s.created_at} — ${s.instrument} ${s.direction.toUpperCase()} @ ${s.entry} (SL ${s.stop_loss} / TP ${s.take_profit}) [${s.source}]</div>
      `).join('') || '<div style="font-size:13px; color:#4a4540;">No signals yet.</div>';
    } catch {
      document.getElementById('recentList').innerHTML = '<div style="font-size:13px; color:#4a4540;">Could not load recent signals.</div>';
    }
  }

  function showPanel() {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('panelView').style.display = 'block';
    loadRecent();
  }

  if (adminToken) showPanel();
</script>
</body>
</html>
