<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLDWIRE Admin</title>
<style>
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; background:#14110f; color:#eee; margin:0; padding:24px; }
  .card { background:#1e1a17; border-radius:12px; padding:24px; max-width:480px; margin:0 auto 20px; border:1px solid #333; }
  h1 { font-size:18px; color:#e8a317; margin-top:0; }
  input, select, textarea { width:100%; box-sizing:border-box; padding:10px; margin:6px 0 14px; border-radius:6px; border:1px solid #444; background:#0f0c0a; color:#eee; }
  button { width:100%; padding:12px; border:none; border-radius:6px; background:#e8a317; color:#14110f; font-weight:bold; cursor:pointer; }
  button:hover { opacity:0.9; }
  .signal { border-bottom:1px solid #333; padding:10px 0; font-size:14px; }
  .buy { color:#0f9d58; } .sell { color:#e63946; }
  #error { color:#e63946; font-size:13px; min-height:16px; }
  #app { display:none; }
</style>
</head>
<body>

<div class="card" id="login">
  <h1>Admin Login</h1>
  <input type="password" id="password" placeholder="Admin password">
  <button onclick="login()">Log in</button>
  <div id="error"></div>
</div>

<div id="app">
  <div class="card">
    <h1>Post a Signal</h1>
    <input id="instrument" placeholder="Instrument (e.g. XAU/USD)">
    <select id="direction">
      <option value="buy">BUY</option>
      <option value="sell">SELL</option>
    </select>
    <input id="entry" placeholder="Entry price">
    <input id="stop_loss" placeholder="Stop loss">
    <input id="take_profit" placeholder="Take profit">
    <textarea id="note" placeholder="Note (optional)" rows="3"></textarea>
    <button onclick="postSignal()">Send Signal</button>
    <div id="postError" style="color:#e63946; font-size:13px; margin-top:8px;"></div>
  </div>

  <div class="card">
    <h1>Recent Signals</h1>
    <div id="signals">Loading…</div>
  </div>
</div>

<script>
  const API = ''; // same-origin; leave blank unless your API lives on a different domain

  function getToken() { return localStorage.getItem('admin_token'); }

  async function login() {
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('error');
    errEl.textContent = '';
    try {
      const res = await fetch(API + '/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || 'Login failed'; return; }
      localStorage.setItem('admin_token', data.token);
      showApp();
    } catch (e) {
      errEl.textContent = 'Network error';
    }
  }

  async function postSignal() {
    const body = {
      instrument: document.getElementById('instrument').value,
      direction: document.getElementById('direction').value,
      entry: document.getElementById('entry').value,
      stop_loss: document.getElementById('stop_loss').value,
      take_profit: document.getElementById('take_profit').value,
      note: document.getElementById('note').value
    };
    const errEl = document.getElementById('postError');
    errEl.textContent = '';
    try {
      const res = await fetch(API + '/api/signals/admin', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + getToken()
        },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || 'Failed to send'; return; }
      loadSignals();
      document.getElementById('instrument').value = '';
      document.getElementById('entry').value = '';
      document.getElementById('stop_loss').value = '';
      document.getElementById('take_profit').value = '';
      document.getElementById('note').value = '';
    } catch (e) {
      errEl.textContent = 'Network error';
    }
  }

  async function loadSignals() {
    const el = document.getElementById('signals');
    try {
      const res = await fetch(API + '/api/signals/recent', {
        headers: { 'Authorization': 'Bearer ' + getToken() }
      });
      const data = await res.json();
      if (!res.ok) { el.textContent = data.error || 'Could not load signals'; return; }
      el.innerHTML = data.signals.map(s => `
        <div class="signal">
          <strong>${s.instrument}</strong>
          <span class="${s.direction}">${s.direction.toUpperCase()}</span>
          — entry ${s.entry}, SL ${s.stop_loss}, TP ${s.take_profit}
        </div>
      `).join('') || 'No signals yet.';
    } catch (e) {
      el.textContent = 'Network error';
    }
  }

  function showApp() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadSignals();
  }

  if (getToken()) showApp();
</script>

</body>
</html>
