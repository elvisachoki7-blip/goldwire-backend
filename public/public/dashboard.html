<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLDWIRE Dashboard</title>
<style>
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; background:#14110f; color:#eee; margin:0; padding:24px; }
  .card { background:#1e1a17; border-radius:12px; padding:24px; max-width:480px; margin:0 auto 20px; border:1px solid #333; }
  h1 { font-size:18px; color:#e8a317; margin-top:0; }
  input, select { width:100%; box-sizing:border-box; padding:10px; margin:6px 0 14px; border-radius:6px; border:1px solid #444; background:#0f0c0a; color:#eee; }
  button { width:100%; padding:12px; border:none; border-radius:6px; background:#e8a317; color:#14110f; font-weight:bold; cursor:pointer; }
  button:hover { opacity:0.9; }
  .link-btn { background:none; color:#e8a317; text-decoration:underline; font-weight:normal; padding:6px; margin-top:4px; }
  .signal { border-bottom:1px solid #333; padding:10px 0; font-size:14px; }
  .buy { color:#0f9d58; } .sell { color:#e63946; }
  #error, #signupError { color:#e63946; font-size:13px; min-height:16px; }
  #app, #signup { display:none; }
  .welcome { font-size:14px; color:#aaa; margin-bottom:16px; }
  .plan-badge { display:inline-block; background:#e8a317; color:#14110f; font-size:11px; font-weight:bold; padding:2px 8px; border-radius:10px; margin-left:6px; }
  .logout { background:#333; color:#eee; margin-top:8px; }
</style>
</head>
<body>

<div class="card" id="login">
  <h1>Log In</h1>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Log In</button>
  <button class="link-btn" onclick="showSignup()">Need an account? Sign up</button>
  <div id="error"></div>
</div>

<div class="card" id="signup">
  <h1>Create Account</h1>
  <input id="su_name" placeholder="Name">
  <input type="email" id="su_email" placeholder="Email">
  <input type="password" id="su_password" placeholder="Password">
  <select id="su_plan">
    <option value="starter">Starter (delayed signals)</option>
    <option value="pro">Pro (instant signals)</option>
  </select>
  <button onclick="signup()">Sign Up</button>
  <button class="link-btn" onclick="showLogin()">Already have an account? Log in</button>
  <div id="signupError"></div>
</div>

<div id="app">
  <div class="card">
    <h1>Welcome<span id="planBadge" class="plan-badge"></span></h1>
    <div class="welcome" id="welcomeText"></div>
    <button class="logout" onclick="logout()">Log Out</button>
  </div>

  <div class="card">
    <h1>Signal History</h1>
    <div id="signals">Loading…</div>
  </div>
</div>

<script>
  const API = ''; // same-origin; leave blank unless your API lives on a different domain

  function getToken() { return localStorage.getItem('user_token'); }
  function setToken(t) { localStorage.setItem('user_token', t); }
  function clearToken() { localStorage.removeItem('user_token'); }

  function showSignup() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('signup').style.display = 'block';
  }
  function showLogin() {
    document.getElementById('signup').style.display = 'none';
    document.getElementById('login').style.display = 'block';
  }

  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('error');
    errEl.textContent = '';
    try {
      const res = await fetch(API + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || 'Login failed'; return; }
      setToken(data.token);
      showApp(data.user);
    } catch (e) {
      errEl.textContent = 'Network error';
    }
  }

  async function signup() {
    const name = document.getElementById('su_name').value;
    const email = document.getElementById('su_email').value;
    const password = document.getElementById('su_password').value;
    const plan = document.getElementById('su_plan').value;
    const errEl = document.getElementById('signupError');
    errEl.textContent = '';
    try {
      const res = await fetch(API + '/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, plan })
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || 'Signup failed'; return; }
      setToken(data.token);
      showApp(data.user);
    } catch (e) {
      errEl.textContent = 'Network error';
    }
  }

  function logout() {
    clearToken();
    document.getElementById('app').style.display = 'none';
    document.getElementById('login').style.display = 'block';
  }

  async function loadMe() {
    try {
      const res = await fetch(API + '/api/auth/me', {
        headers: { 'Authorization': 'Bearer ' + getToken() }
      });
      const data = await res.json();
      if (!res.ok) { logout(); return null; }
      return data.user;
    } catch (e) {
      return null;
    }
  }

  async function loadSignals() {
    const el = document.getElementById('signals');
    try {
      const res = await fetch(API + '/api/signals', {
        headers: { 'Authorization': 'Bearer ' + getToken() }
      });
      const data = await res.json();
      if (!res.ok) { el.textContent = data.error || 'Could not load signals'; return; }
      el.innerHTML = data.signals.map(s => `
        <div class="signal">
          <strong>${s.instrument}</strong>
          <span class="${s.direction}">${s.direction.toUpperCase()}</span>
          — entry ${s.entry}, SL ${s.stop_loss}, TP ${s.take_profit}
          ${s.note ? `<div style="color:#999; font-size:12px; margin-top:4px;">${s.note}</div>` : ''}
        </div>
      `).join('') || 'No signals yet.';
    } catch (e) {
      el.textContent = 'Network error';
    }
  }

  function showApp(user) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('signup').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('welcomeText').textContent = user.name + ' (' + user.email + ')';
    document.getElementById('planBadge').textContent = user.plan;
    loadSignals();
  }

  (async function init() {
    if (getToken()) {
      const user = await loadMe();
      if (user) showApp(user);
    }
  })();
</script>

</body>
</html>
